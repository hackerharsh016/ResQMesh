buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

ext {
    buildToolsVersion = "33.0.0"
    minSdkVersion = 26
    compileSdkVersion = 33
    targetSdkVersion = 33
    ndkVersion = "23.1.7779620"
    kotlinVersion = "1.8.0"
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url("$rootDir/../frontend/node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../frontend/node_modules/jsc-android/dist")
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }
}
